<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Simlet">
  <!--
    Simlet 主图标。512×512，三层：方形圆角底 / SIM 卡 / 定位图钉。
    卡的左上斜切角是 SIM 的身份，卡中心的图钉是「这张卡被钉到了别的国家」。
    图形几何见 brand/README.md；改几何要连同 app/src/main/res/drawable/ic_launcher_*.xml 一起改。
  -->
  <rect width="512" height="512" rx="116" fill="#699973"/>
  <!-- 图形本体按 240×280 画在 (256,256) 上，再整体放大 1.15 撑满底 -->
  <g transform="translate(256 256) scale(1.15) translate(-256 -256)">
    <!-- SIM 卡：240×280，圆角 26，左上 76 斜切 -->
    <path fill="#FCFCFC" d="M222 116 L350 116 Q376 116 376 142 L376 370 Q376 396 350 396 L162 396 Q136 396 136 370 L136 202 Q136 192 143.07 184.93 L204.93 123.07 Q212 116 222 116 Z"/>
    <!-- 图钉：圆心 (256,233) 半径 54，尖端 (256,333)，两条边与圆相切 -->
    <path fill="#131313" d="M256 333 L301.5 262.2 A54 54 0 1 0 210.5 262.2 Z"/>
    <circle cx="256" cy="233" r="20" fill="#FCFCFC"/>
  </g>
</svg>
