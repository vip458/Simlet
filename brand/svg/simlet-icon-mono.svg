<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Simlet">
  <!--
    单色版：一条路径 + evenodd，卡是实的、两条箭头镂空。
    用 currentColor，换色不用改路径；印刷、蚀刻、水印，以及 Android 自适应图标的
    monochrome 层都走这一版（那一层会把整张涂成一个颜色，三色叠加会糊成一团）。
    这里箭头写成实心多边形而不是描边：镂空只能镂空填充形状。杆端补了 13 圆帽，
    箭头尖保留直角——单色用途下这反而更好刻。
  -->
  <g transform="translate(256 256) scale(1.15) translate(-256 -256)" fill="currentColor">
    <path fill-rule="evenodd" d="M222 116 L350 116 Q376 116 376 142 L376 370 Q376 396 350 396 L162 396 Q136 396 136 370 L136 202 Q136 192 143.07 184.93 L204.93 123.07 Q212 116 222 116 Z M200,215 L284,215 L284,200 L312,228 L284,256 L284,241 L200,241 A13,13 0 0 1 200,215 Z M312,277 L228,277 L228,262 L200,290 L228,318 L228,303 L312,303 A13,13 0 0 0 312,277 Z"/>
  </g>
</svg>
